name: CI

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment) so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No provider keys are set: the suite is keyless by design — fakes sit only at the SDK
      # boundary, and a network guard fails any test that reaches a live host.
      - run: npm test

      - run: npm run build

      - run: npm run test:coverage

      - run: npm run security:audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment) so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # No secrets in this job: the e2e server (scripts/e2e-server.ts) mints its own throwaway
      # secrets and redirects every provider call to a local fake at the transport boundary.
      - run: npm run test:e2e -- --reporter=list,html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: CI

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment) so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No provider keys are set: the suite is keyless by design — fakes sit only at the SDK
      # boundary, and a network guard fails any test that reaches a live host.
      - run: npm test

      - run: npm run build

      - run: npm run test:coverage

      # Uploaded even when the threshold check above fails the step, so a regression is visible
      # in the run's artifacts rather than only in the red exit code.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

      - run: npm run security:audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment) so a moved tag can't change the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # No secrets in this job: the e2e server (scripts/e2e-server.ts) mints its own throwaway
      # secrets and redirects every provider call to a local fake at the transport boundary.
      - run: npm run test:e2e -- --reporter=list,html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
